<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Filas de atendimento por setor">
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="5" height="5" fill="#c9dcfa"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b2a5b" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#e8eaee"/>

  <!-- cantos pixelados -->
  <rect x="48" y="48" width="72" height="48" fill="url(#dots)" opacity="0.9"/>
  <rect x="1080" y="48" width="72" height="48" fill="url(#dots)" opacity="0.9"/>
  <rect x="48" y="534" width="72" height="48" fill="url(#dots)" opacity="0.9"/>
  <rect x="1080" y="534" width="72" height="48" fill="url(#dots)" opacity="0.9"/>

  <!-- caixa de entrada unica -->
  <g filter="url(#soft)">
    <rect x="150" y="150" width="268" height="330" rx="18" fill="#ffffff" stroke="#e3e6ec"/>
  </g>
  <rect x="150" y="150" width="268" height="56" rx="18" fill="#1875ee"/>
  <rect x="150" y="188" width="268" height="18" fill="#1875ee"/>
