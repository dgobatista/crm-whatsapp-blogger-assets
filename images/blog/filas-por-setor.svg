    <rect x="636" y="198" width="40" height="40" rx="12" fill="#1875ee"/>
    <rect x="648" y="212" width="16" height="12" rx="3" fill="#ffffff"/>
    <rect x="696" y="202" width="150" height="10" rx="5" fill="#2b3340"/>
    <rect x="696" y="222" width="232" height="8" rx="4" fill="#b9c3d2"/>
