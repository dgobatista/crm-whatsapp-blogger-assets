    <rect x="190" y="318" width="24" height="20" rx="6"/>
    <rect x="190" y="388" width="24" height="20" rx="6"/>
  </g>
  <g fill="#aebed6">
    <rect x="226" y="250" width="140" height="7" rx="3.5"/>
    <rect x="226" y="264" width="96" height="7" rx="3.5"/>
    <rect x="226" y="320" width="140" height="7" rx="3.5"/>
    <rect x="226" y="334" width="110" height="7" rx="3.5"/>
    <rect x="226" y="390" width="140" height="7" rx="3.5"/>
    <rect x="226" y="404" width="84" height="7" rx="3.5"/>
